# nginx для popovichfit.ru: статика из .output/public (пререндер), остальное — в node (Nitro) на 3100.
# Редиректы старых адресов Тильды — из карты .output/redirects.map (генерирует scripts/postgenerate.mjs).
# До переноса домена сайт доступен по IP (server_name _); после — добавить server_name popovichfit.ru www.popovichfit.ru и certbot.
map $uri $pf_redirect {
    default "";
    include /var/www/popovichfit/current/redirects.map;
}

# Режим продаж (app/data/sales.ts). Пока продажи закрыты, страниц /pred, /predcor, /predpow нет в релизе: nginx отдаёт 302 на курсы/главную.
# При SALES_OPEN=true сборка пререндерит маркер sales-open/index.html — тогда адреса отдают страницы (см. README, «Режим продаж»).
map $uri $pf_sales_target {
    default "";
    /pred /;
    /predcor /course_correction;
    /predpow /course_power;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/popovichfit/current/public;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # старые адреса Тильды → новые (301)
    if ($pf_redirect != "") { return 301 $pf_redirect$is_args$args; }
    # страницы продаж: закрыто -> 302 (query r/utm сохраняются, #якорь браузер переносит сам); открыто -> пререндеренный файл или node
    location ~ ^/(pred|predcor|predpow)$ {
        if (!-f $document_root/sales-open/index.html) { return 302 $pf_sales_target$is_args$args; }
        try_files $uri/index.html $uri.html @node;
    }
    # без завершающего слэша
    rewrite ^/(.+)/$ /$1 permanent;

    location /_nuxt/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location ~* \.(webp|png|jpe?g|svg|ico|woff2?|css|js)$ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

    # формы, корзина, вебхук оплаты, sitemap — node
    location ~ ^/(api/|sitemap\.xml$) {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # пререндеренные страницы: /about → /about/index.html, /page123.html → файл; иначе node (404 своей страницей)
    location / {
        try_files $uri $uri/index.html $uri.html @node;
    }
    location @node {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
