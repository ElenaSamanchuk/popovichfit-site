<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Функция для вставки содержимого

      var targetElement = document.querySelector("#rec828582931 .t-rasrochka");

      if (sourceBlock && targetElement) {
        targetElement.innerHTML = sourceBlock.innerHTML;
        console.log("Содержимое успешно вставлено.");
        clearInterval(checkInterval); // Останавливаем проверку после успешной вставки
