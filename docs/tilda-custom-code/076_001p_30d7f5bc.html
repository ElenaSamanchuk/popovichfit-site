<!--https://romanyu.ru/skroll-strelki--> <script src="https://unpkg.com/scrollbooster@3/dist/scrollbooster.min.js" defer></script> <script>
$(function() {

    // Укажи ID Zero блока cо скроллом и включи overflow: auto
    var blockScrollId = '#rec817735025';
    
    // Укажи ID Zero блока cо стрелками и добавь каждой класс arrow-left или arrow-right
    var blockArrowsId = '#rec817735024';
    
    var shiftSize;
    $(window).on('load resize', function(){
        
        if (window.matchMedia('(max-width: 480px)').matches) {
            shiftSize = '320px';
        }
        else if (window.matchMedia('(max-width: 640px)').matches) {
            shiftSize = '320px';
        }
        else if (window.matchMedia('(max-width: 960px)').matches) {
            shiftSize = '320px';
        }
        else if (window.matchMedia('(max-width: 1200px)').matches) {
            shiftSize = '320px';
        }
        else {
            shiftSize = '320px';
        }

    });
    
    $(blockScrollId + ' .t396__artboard').addClass('scrollbooster-viewport').wrapInner('<div class="scrollbooster-content"></div>');
    $(blockScrollId + ' .t396').css({'overflow-x':'auto', 'overflow-y':'hidden'}); // Оставляем только горизонтальный скролл

    new ScrollBooster({
        viewport: $(blockScrollId + ' .scrollbooster-viewport')[0],
        content:  $(blockScrollId + ' .scrollbooster-content')[0],
        scrollMode: 'native',
        pointerMode: 'mouse',
        bounce: false,
        direction: 'horizontal', // Блокируем вертикальный скролл
        onPointerDown: function() { $(blockScrollId + ' *:focus').blur() }
    });

    $(blockArrowsId + ' .arrow-left').on('click', function(e) {
        e.preventDefault();
        $(blockScrollId + ' .t396__artboard').animate( { scrollLeft: '-=' + shiftSize }, 300);
    });

    $(blockArrowsId + ' .arrow-right').on('click', function(e) {
        e.preventDefault();
        $(blockScrollId + ' .t396__artboard').animate( { scrollLeft: '+=' + shiftSize }, 300);
    });

});
</script> <style>
.scrollbooster-viewport {
    cursor: -webkit-grab;
    cursor: grab;
    padding-bottom: 30px;
    margin-bottom: -30px;
    overflow-y: hidden !important; /* Запрещаем вертикальный скролл */
    white-space: nowrap; /* Не переносим элементы */
}
.scrollbooster-viewport:active {
    cursor: -webkit-grabbing;
    cursor: grabbing;
}
.scrollbooster-content {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow-y: hidden; /* Блокируем вертикальный скролл */
}
.arrow-left,
.arrow-right {
    cursor: pointer;
}
</style>
