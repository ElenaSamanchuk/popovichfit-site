<script>
document.addEventListener("DOMContentLoaded", function () {
    // Определяем текущий URL
    const urlParams = new URLSearchParams(window.location.search);
    const rParam = urlParams.get('r'); // Получаем значение параметра r

    // Находим все ссылки в блоке с конкретным ID
    const block = document.querySelector('#rec774130793'); // Замените ID на ваш ID Zero Блока
    if (block) {
        const links = block.querySelectorAll('a'); // Все ссылки внутри блока
        links.forEach(link => {
            const href = link.getAttribute('href'); // Получаем href ссылки
            if (href && href.startsWith("https://t.me/POPOVICHcourse_bot")) {
                // Если параметр r присутствует
                if (rParam) {
                    // Заменяем ссылку полностью на новую с параметром
                    const newUrl = `https://salebot.site/62b5cbabae0fe1409f44ce65d9274be9_1?utm_content=r%3D${rParam}`;
                    link.setAttribute('href', newUrl);
                }
                // Если rParam отсутствует, ссылка остается https://t.me/POPOVICHcourse_bot
            }
        });
    }
});
</script>
