<script>
document.addEventListener('DOMContentLoaded', function () {
  var BLOCK_ID    = 'rec4176428801';
  var SHOW_AFTER  = 300;          // через сколько пикселей прокрутки показывать
  var FIXED_CLASS = 'js-fixed-block';

  var block = document.getElementById(BLOCK_ID);
  if (!block) return;

  var isVisible = false;
  var ticking = false;

  function update() {
    var scrolled = window.pageYOffset || document.documentElement.scrollTop;
    var shouldShow = scrolled > SHOW_AFTER;          // без ограничения по ширине
    if (shouldShow !== isVisible) {
      block.classList.toggle(FIXED_CLASS, shouldShow);
      document.body.classList.toggle('js-fixed-block-active', shouldShow);
      isVisible = shouldShow;
    }
    ticking = false;
  }

  function onScroll() {
    if (!ticking) { requestAnimationFrame(update); ticking = true; }
  }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll, { passive: true });
  update();
});
</script>
